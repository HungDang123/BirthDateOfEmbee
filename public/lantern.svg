<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" fill="none">
  <!-- Glow -->
  <ellipse cx="24" cy="30" rx="16" ry="22" fill="#FF6B6B" opacity="0.15" filter="url(#glow)"/>
  <!-- Lantern body -->
  <ellipse cx="24" cy="30" rx="13" ry="20" fill="#FF4444" opacity="0.92"/>
  <!-- Highlight strip -->
  <ellipse cx="24" cy="28" rx="10" ry="16" fill="#FF6B6B" opacity="0.4"/>
  <!-- Top cap -->
  <rect x="18" y="7" width="12" height="5" rx="2" fill="#D4AF37"/>
  <rect x="21" y="12" width="6" height="3" rx="1" fill="#FFD700"/>
  <!-- Hanging string -->
  <line x1="24" y1="0" x2="24" y2="7" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Bottom cap -->
  <rect x="19" y="49" width="10" height="4" rx="1.5" fill="#D4AF37"/>
  <!-- Tassel -->
  <line x1="24" y1="53" x2="24" y2="60" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="24" cy="61" r="2" fill="#FFD700"/>
  <!-- Chinese character -->
  <text x="24" y="35" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#FFD700" font-weight="bold" opacity="0.85">福</text>
  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
